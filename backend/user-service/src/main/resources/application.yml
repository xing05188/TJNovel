server:
  port: 7081

spring:
  application:
    name: user-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://mydatabase123.mysql.database.azure.com:3306/userdb?useSSL=true&requireSSL=true
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  issuer: our-novel
  audience: our-novel
  key: your-256-bit-secret-key-here-must-be-at-least-32-characters-long
  expiration: 7200000  # 2 hours in milliseconds

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

azure:
  storage:
    connection-string: 
    container: 

