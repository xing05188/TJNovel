server:
  port: 7082

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://mydatabase123.mysql.database.azure.com:3306/contentdb?useSSL=true&requireSSL=true
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

azure:
  storage:
    connection-string:
    container: 

