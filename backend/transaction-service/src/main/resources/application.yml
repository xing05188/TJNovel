server:
  port: 7083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/transactiondb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username:
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # RabbitMQ 配置（消息队列，用于交易通知等）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tjnovel}
    password: ${RABBITMQ_PASSWORD:tjnovel123}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 支付宝沙盒配置
alipay:
  server-url: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # 沙箱 APPID（在开放平台沙箱后台获取，以 902100 开头）
  app-id: ${ALIPAY_APP_ID:9021000158638440}
  # 应用私钥（PKCS8，由支付宝开放平台工具生成，切勿外泄）
  private-key: ${ALIPAY_PRIVATE_KEY:}
  # 支付宝公钥（在沙箱后台上传应用公钥后，平台返回的支付宝公钥）
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 异步通知地址（需外网可达；本机联调可用网关地址，支付宝沙箱回调仅用于模拟）
  notify-url: ${ALIPAY_NOTIFY_URL:http://20.243.208.35:7080/api/payment/alipay/notify}
  return-url: chargelink://payment/return
  charset: UTF-8
  sign-type: RSA2
  format: json

# 应用基础URL配置（用于支付宝回调，指向API网关）
app:
  base-url: http://localhost:7080

# 服务地址配置（从环境变量读取，Docker 环境使用服务名）
services:
  user: ${SERVICES_USER:http://localhost:7081}
  content: ${SERVICES_CONTENT:http://localhost:7082}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: edu.tongji.transactionservice.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

